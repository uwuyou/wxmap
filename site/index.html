<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>EC / GFS 天气可视化 (NetCDF 纯前端)</title>
<link rel="stylesheet" href="leaflet.css"/>
  <script src="leaflet.js"></script>
  <script src="netcdfjs.js"></script>
<style>
:root{--bg:#0d1626;--panel:rgba(16,26,45,.92);--line:#2b3c59;--txt:#dbe7ff;--muted:#8aa0c4;--acc:#4aa3ff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#map{position:absolute;left:0;top:0;bottom:0;width:100%;background:#a9c9e8}
#map2{position:absolute;left:51%;top:0;bottom:0;width:calc(50% - 2px);background:#a9c9e8;display:none;border-left:2px solid var(--line)}
body.compare #map{width:50%}
body.compare #map2{display:block}
.panel{position:absolute;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
#ctl{top:12px;left:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto}
h1{font-size:16px;margin:0 0 2px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:11px;margin-bottom:10px}
.row{margin:9px 0}
.lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
select,input[type=range],.btn{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:#0f1a2e;color:var(--txt);font-size:14px;outline:none}
.switch,.btns{display:flex;gap:4px;flex-wrap:wrap}
.btn{flex:1;text-align:center;cursor:pointer;border:1px solid var(--line);background:#0f1a2e;min-width:58px;touch-action:manipulation}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
#compareBtn.on{background:#ffb54a;color:#2a1600;border-color:#ffb54a}
.oprow{display:flex;align-items:center;gap:8px}
.oprow input[type=range]{flex:1}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.check input{width:auto;flex:none;width:18px;height:18px}
.legend{position:absolute;z-index:1000;left:12px;bottom:14px;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.legend h3{margin:0 0 6px;font-size:12px}
.bar{height:12px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
.labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}
#status{position:absolute;z-index:1000;right:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;max-width:46%}
#status .d{color:var(--muted);font-size:11px;margin-top:3px;word-break:break-all}
.cmpbar{position:absolute;z-index:1000;left:50%;transform:translateX(-50%);top:12px;display:none;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;align-items:center}
body.compare .cmpbar{display:flex}
.cmpbar select{width:90px}
.cmpbar .t{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted)}
.offline{position:absolute;z-index:2000;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.offline h2{margin:0 0 6px}
.offline p{color:var(--muted);font-size:13px;margin:4px 0}
</style>
</head>
<body>
<div id="map"></div>
<div id="map2"></div>

<div class="cmpbar">
  <div class="t">左图 (A)<select id="stepA"></select></div>
  <div class="t">右图 (B)<select id="stepB"></select></div>
</div>

<div class="panel" id="ctl">
  <h1>🌦 EC / GFS 天气</h1>
  <div class="sub" id="runInfo">读取数据索引…</div>
  <div class="row"><span class="lbl">数据源</span>
    <div class="switch" id="srcBtns"></div>
  </div>
  <div class="row"><span class="lbl">气象要素</span>
    <div class="btns" id="elems">
      <div class="btn on" data-e="cloud" onclick="setElem('cloud')">云</div>
      <div class="btn" data-e="rain" onclick="setElem('rain')">雨</div>
      <div class="btn" data-e="fog" onclick="setElem('fog')">雾</div>
      <div class="btn" data-e="rh" onclick="setElem('rh')">湿度</div>
      <div class="btn" data-e="temp" onclick="setElem('temp')">温度</div>
    </div>
  </div>
  <div class="row"><span class="lbl">海拔 / 气压层 <span id="lvlNote" style="color:#9db4d9"></span></span>
    <select id="level" onchange="setLevel(this.value)"></select>
  </div>
  <div class="row"><span class="lbl">预报时效</span>
    <div class="btns" style="margin-bottom:6px">
      <div class="btn" onclick="stepN(-1)">◀ 上一时次</div>
      <div class="btn" onclick="stepN(1)">下一时次 ▶</div>
      <div class="btn" id="compareBtn" onclick="toggleCompare()">🔁 对比</div>
    </div>
    <input type="range" id="step" min="0" max="0" step="1" oninput="setStep(+this.value)"/>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px"><span id="stepTxt">-</span><span id="validTxt"></span></div>
  </div>
  <div class="row"><span class="lbl">叠加不透明度</span><input type="range" id="opacity" min="5" max="100" value="70" oninput="setOpacity(+this.value/100)"/></div>
  <div class="row check"><input type="checkbox" id="wd" checked onchange="render()"/> 风矢量箭头</div>
  <div class="row"><span class="lbl">箭头长度</span><input type="range" id="wscale" min="0.4" max="3" step="0.1" value="1" oninput="render()"/></div>
</div>

<div class="legend">
  <h3 id="lgTitle">图例</h3>
  <div class="bar" id="lgBar"></div>
  <div class="labels"><span id="lgMin">-</span><span id="lgMax">-</span></div>
</div>

<div id="status"><b id="st">加载中…</b><div class="d" id="stD">请稍候</div></div>

<script>
const META={
  temp:{title:"温度",unit:"°C",
    fs:[[38,38,120],[60,120,230],[90,200,255],[70,190,90],[245,230,80],[245,140,60],[220,45,40]],
    scale:v=>clamp((v+45)/90,0,1)},
  rh:{title:"相对湿度",unit:"%",
    fs:[[160,150,120],[220,220,160],[120,200,120],[80,170,200],[30,110,200],[90,30,170]],
    scale:v=>clamp(v/100,0,1)},
  cloud:{title:"总云量",unit:"%",
    fs:[[250,252,255],[210,214,222],[160,170,184],[110,120,140],[70,78,96],[36,42,56]],
    scale:v=>clamp(v/100,0,1)},
  rain:{title:"降水强度",unit:"mm/h",
    fs:[[8,70,140],[30,130,220],[60,100,230],[120,70,220],[190,60,200],[230,90,120],[255,230,120]],
    scale:v=>clamp(Math.log10(Math.max(v,0.02)+0.02)/2.4,0,1),log:true},
  fog:{title:"雾(低云+湿度)",unit:"",
    fs:[[245,245,245],[210,225,235],[170,205,225],[130,180,215],[90,150,200],[50,110,175]],
    scale:v=>clamp(v/100,0,1)}
};
const SURF_ONLY=["rain","fog","cloud"];
const VARIABLES=["temp","rh","cloud","rain","fog"];
var manifest=null, source="", run=null, steps=[], ist=0, level="surface", elem="cloud", compare=false;
var lat=[],lon=[],grids=null,gridsB=null;
var ovA=null,ovB=null,windA=null,windB=null,opacity=0.7;
var NCParser=netcdf_global&&netcdf_global.NetCDFReader;
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function $(id){return document.getElementById(id)}

/* GCJ02 offset for Tencent tiles */
function outOfChina(lat,lng){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
const PI=Math.PI,A=6378245,EE=0.00669342162296594323;
function _tlat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3; r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3; return r;}
function _tlng(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3; r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
  r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3; return r;}
function wgs2gcj(lat,lng){if(outOfChina(lat,lng))return[lat,lng];
  let dlat=_tlat(lng-105,lat-35),dlng=_tlng(lng-105,lat-35);
  let rad=lat/180*PI,m=Math.sin(rad),s=1-EE*m*m,sq=Math.sqrt(s);
  dlat=dlat*180/((A*(1-EE))/(s*sq)*PI); dlng=dlng*180/(A/sq*Math.cos(rad)*PI);
  return [lat+dlat,lng+dlng];}
function ll(lat,lng){let g=wgs2gcj(lat,lng);return L.latLng(g[0],g[1]);}

var base=L.tileLayer("https://rt{s}.map.gtimg.com/realtimerender?z={z}&x={x}&y={y}&type=vector&styleid=1",
  {subdomains:"0123",maxZoom:18,attribution:"Tencent",tileSize:256});
function initMap(el){var m=L.map(el,{zoomControl:false,attributionControl:false,zoomSnap:.5}).setView([32.5,106],5);base.addTo(m);return m;}
var map=initMap("map");
var map2=initMap("map2"); map2.options.zoomControl=false;
L.control.zoom({position:"topright"}).addTo(map);

function colorFor(v){const M=META[elem];if(v==null||!isFinite(v))return[0,0,0,0];
  const t=M.scale(v),fs=M.fs,f=t*(fs.length-1),i=Math.min(Math.floor(f),fs.length-2),fr=f-i,c0=fs[i],c1=fs[i+1];
  let r=c0[0]+(c1[0]-c0[0])*fr,g=c0[1]+(c1[1]-c0[1])*fr,b=c0[2]+(c1[2]-c0[2])*fr,a=1;
  if(elem==="rain"&&v<0.05)a=0; if(elem==="fog"&&v<12)a=0;
  return [r,g,b,a*0.9];}
function setLegend(){
  const M=META[elem],fs=M.fs;
  const stops=fs.map((c,i)=>`rgba(${c[0]},${c[1]},${c[2]},1) ${i/(fs.length-1)*100}%`).join(",");
  $("lgBar").style.background="linear-gradient(90deg,"+stops+")";
  $("lgTitle").textContent=M.title+(M.unit?" ("+M.unit+")":"");
  $("lgMin").textContent=elem==="temp"?"-30°C":(elem==="rain"?"<0.05":0);
  $("lgMax").textContent=elem==="temp"?"40°C":(elem==="rain"?"≥50mm/h":"高");
}
function elemVar(g){ // 返回当前要素变量(nested 2D), 气压层限制逻辑与 layer 一致
  if(!g)return null;
  if(level!=="surface"&&SURF_ONLY.indexOf(elem)>=0)return null;
  const key=(level==="surface"?"sfc_":level+"_")+elem;
  return g[key]||null;}

function buildRaster(m){
  const dd=(m===map2)?gridsB:grids;
  const data=elemVar(dd); if(!data)return null;
  const ny=data.length,nx=data[0].length,S=2,W=(nx-1)*S,H=(ny-1)*S,can=document.createElement("canvas");
  can.width=Math.max(1,W);can.height=Math.max(1,H);
  const ctx=can.getContext("2d"),im=ctx.createImageData(can.width,can.height);im.data.fill(0);
  for(let y=0;y<H;y++){const fy=y/S,i0=Math.min(Math.floor(fy),ny-2),ff=fy-i0;
    for(let x=0;x<W;x++){const fx=x/S,j0=Math.min(Math.floor(fx),nx-2),fk=fx-j0;
      const v00=data[i0][j0],v01=data[i0][j0+1],v10=data[i0+1][j0],v11=data[i0+1][j0+1];
      const a=lerp(v00,v01,fk),c=lerp(v10,v11,fk),v=lerp(a,c,ff);
      if(v==null)continue; const col=colorFor(v),p=(y*W+x)*4;
      im.data[p]=col[0];im.data[p+1]=col[1];im.data[p+2]=col[2];im.data[p+3]=Math.round(col[3]*255);}}
  ctx.putImageData(im,0,0);
  const la=(m===map2)?lat:lat,lo=(m===map2)?lon:lon;
  const sw=ll(la[la.length-1],lo[0]),ne=ll(la[0],lo[lo.length-1]);
  return L.imageOverlay(can.toDataURL(),L.latLngBounds(sw,ne),{opacity:opacity,interactive:false,zIndex:400}).addTo(m);
}
function lerp(a,b,f){if(a==null||!isFinite(a))return b==null||!isFinite(b)?null:b;if(b==null||!isFinite(b))return a;return a+(b-a)*f;}

function addWind(m){const c=document.createElement("canvas");
  c.style.position="absolute";c.style.pointerEvents="none";c.style.zIndex=500;
  m.getPanes().overlayPane.appendChild(c);
  const redraw=()=>requestAnimationFrame(()=>drawWind(m,c));
  m.on("move zoom moveend resize",()=>setTimeout(redraw,10)); setTimeout(redraw,80);
  return {canvas:c,redraw,remove(){m.off("move zoom moveend resize");c.remove();}};}
function drawWind(m,c){const gg=(m===map2)?gridsB:grids;
  if(!gg||!gg.wind_u||!gg.wind_v||!$("wd").checked)return;
  const rc=c.getBoundingClientRect();
  if(c.width!==Math.round(rc.width)||c.height!==Math.round(rc.height)){c.width=Math.round(rc.width);c.height=Math.round(rc.height);}
  const ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
  const u=gg.wind_u,v=gg.wind_v,ny=u.length,nx=u[0].length,la=lat,lo=lon,st=Math.max(1,Math.ceil(Math.max(ny,nx)/46));
  ctx.strokeStyle="rgba(10,20,34,.95)";ctx.fillStyle="#0b1626";ctx.lineWidth=1.4;
  for(let i=0;i<ny;i+=st){for(let j=0;j<nx;j+=st){
    const uu=safe(u,i,j),vv=safe(v,i,j);if(uu==null||vv==null||(Math.abs(uu)<0.4&&Math.abs(vv)<0.4))continue;
    const sp=Math.hypot(uu,vv),Ln=Math.max(5,10+sp*2.2*(+$("wscale").value||1)),a=Math.atan2(vv,uu);
    const p0=m.latLngToContainerPoint(ll(la[i],lo[j]));
    const x2=p0.x+Math.cos(a)*Ln,y2=p0.y+Math.sin(a)*Ln;
    const h=Math.min(6,Ln*0.4),ba=a-135*Math.PI/180,bb=a+135*Math.PI/180;
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(x2,y2);
    ctx.lineTo(x2+h*Math.cos(ba),y2+h*Math.sin(ba));
    ctx.moveTo(x2,y2);ctx.lineTo(x2+h*Math.cos(bb),y2+h*Math.sin(bb));
    ctx.stroke();}}}
function safe(g,i,j){const r=g[i];if(!r)return null;const x=r[j];return x==null||!isFinite(x)?null:x;}

function render(){
  if(ovA){ovA.remove();ovA=null;} if(ovB){ovB.remove();ovB=null;}
  if(windA){windA.remove();windA=null;} if(windB){windB.remove();windB=null;}
  ovA=buildRaster(map);
  if(compare&&gridsB){ovB=buildRaster(map2);}
  if($("wd").checked){windA=addWind(map); if(compare&&gridsB)windB=addWind(map2);}
}
function setOpacity(o){opacity=o;if(ovA)ovA.setOpacity(opacity);if(ovB)ovB.setOpacity(opacity);}

/* ---- NetCDF 纯前端解析 ---- */
function readNc(buf){
  const rd=new NCParser(buf);
  const has=(n)=>{try{return rd.dataVariableExists(n);}catch(e){return false;}};
  const la=Array.prototype.slice.call(rd.getDataVariable("lat"));
  const lo=Array.prototype.slice.call(rd.getDataVariable("lon"));
  const ny=la.length,nx=lo.length;
  const flat2d=(n)=>{let f=rd.getDataVariable(n);if(!f)return null;const v=Array.prototype.slice.call(f);
    const g=new Array(ny);for(let i=0;i<ny;i++){g[i]=new Array(nx);for(let j=0;j<nx;j++)g[i][j]=v[i*nx+j];}
    return g;};
  const gg={};
  const names=["temp","rh","cloud","rain","fog"].map(x=>"sfc_"+x)
    .concat(["925","850","700","500","300"].map(p=>[p+"_temp",p+"_rh",p+"_u",p+"_v"]).flat())
    .concat(["wind_u","wind_v"]);
  for(const n of names){ if(has(n)) gg[n]=flat2d(n); }
  return {lat:la,lon:lo,grids:gg};
}
async function loadStep(i,which){
  const s=steps[i];
  if(i<0||i>=steps.length)return;
  $("st").textContent="加载时效 +"+s+"h…";$("stD").textContent="读取 "+run.files[s]+" (NetCDF)";
  try{
    const r=await fetch("data/"+run.files[s]);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const buf=await r.arrayBuffer();
    const t0=performance.now();
    const nc=readNc(buf);
    const ms=Math.round(performance.now()-t0);
    if(which==="A"){lat=nc.lat;lon=nc.lon;grids=nc.grids;}
    else{gridsB=nc.grids;}
    $("validTxt").textContent="起报 "+run.date.slice(0,4)+"-"+run.date.slice(4,6)+"-"+run.date.slice(6,8)+" "+String(run.hour).padStart(2,"0")+"时";
    $("st").textContent=source+" · 时效 +"+s+"h · 有效到 "+validHours(s)+" · NetCDF解析 "+ms+"ms";
    $("stD").textContent="要素:"+META[elem].title+" 层:"+(level==="surface"?"地面":level+"hPa")+(which==="B"?" (右侧已加载)":"");
    $("stepTxt").textContent="时效 +"+s+"h";
    render();
  }catch(e){$("st").textContent="加载失败: "+e.message;$("stD").textContent="重试中…";setTimeout(()=>loadStep(i,which),2000);}
}
function validHours(s){const d=new Date(Date.UTC(+run.date.slice(0,4),+run.date.slice(4,6)-1,+run.date.slice(6,8),run.hour));d.setUTCHours(d.getUTCHours()+s);return d.toISOString().slice(11,16)+"UTC";}

async function init(){
  try{
    const mr=await fetch("data/manifest.json");
    if(!mr.ok)throw new Error("找不到 manifest.json (需通过 http 服务访问)");
    manifest=await mr.json();
  }catch(e){showOffline(e.message);return;}
  const srcs=Object.keys(manifest.sources||{});
  if(!srcs.length){showOffline("暂无数据: 先运行 tools/build_static_data.py");return;}
  // 数据源按钮
  $("srcBtns").innerHTML="";
  srcs.forEach(s=>{const d=document.createElement("div");d.className="btn"+(s==="GFS"?" on":"");d.textContent=s;d.onclick=()=>setSource(s);$("srcBtns").appendChild(d);});
  // 气压层
  $("level").innerHTML="";
  manifest.levels.forEach(lv=>{const o=document.createElement("option");o.value=lv;
    o.textContent=lv==="surface"?"🌟 地面 / 近地面":lv+" hPa";$("level").appendChild(o);});
  setSource(srcs[0]);
}
function setSource(s){
  source=s;document.querySelectorAll("#srcBtns .btn").forEach(b=>b.classList.toggle("on",b.textContent===s));
  run=manifest.sources[s];steps=run.steps;ist=0;
  const sl=$("step");sl.min=0;sl.max=steps.length-1;sl.value=0;
  fillSteps($("stepA"));fillSteps($("stepB"));$("stepB").value=steps[Math.min(1,steps.length-1)];
  $("runInfo").textContent="起报 "+run.date+" "+String(run.hour).padStart(2,"0")+"时 · "+run.steps.length+" 个时效";
  grids=gridsB=null;loadStep(0,"A");
}
function fillSteps(sel){sel.innerHTML="";steps.forEach(s=>{const o=document.createElement("option");o.value=s;o.text="+"+s+"h";sel.appendChild(o);});}
function setElem(e){elem=e;document.querySelectorAll("#elems .btn").forEach(b=>b.classList.toggle("on",b.dataset.e===e));
  setLegend();$("lvlNote").textContent=(level!=="surface"&&SURF_ONLY.indexOf(e)>=0)?" (云/雨/雾为地面量)":"";
  render();}
function setLevel(v){level=v;setElem(elem);}
function setStep(i){ist=i;loadStep(i,"A");}
function stepN(k){const sl=$("step");sl.value=clamp(+sl.value+k,0,steps.length-1);setStep(+sl.value);}
function toggleCompare(){compare=!compare;$("compareBtn").classList.toggle("on",compare);
  document.body.classList.toggle("compare",compare);
  if(compare){const sb=+$("stepB").value;loadStep(steps.indexOf(sb),"B");}
  else{gridsB=null;render();}}
$("stepA").onchange=function(){grids=null;loadStep(steps.indexOf(+this.value),"A");};
$("stepB").onchange=function(){gridsB=null;loadStep(steps.indexOf(+this.value),"B");};
function showOffline(msg){
  const d=document.createElement("div");d.className="offline";
  d.innerHTML=`<h2>⚠️ 无法加载</h2><p>${msg}</p>`;document.body.appendChild(d);
  $("status").style.display="none";
}
setLegend();
init();
</script>
</body>
</html>
